<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vehicle Price Predictor</title>
<style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; background: #f7f8fa; color: #222; }
    h1 { color: #1f3864; }
    form { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px 20px; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    label { font-size: 13px; font-weight: bold; color: #444; display: block; margin-bottom: 3px; }
    input, select { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    .full-row { grid-column: 1 / -1; }
    button { margin-top: 16px; background: #1f3864; color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 15px; }
    button:hover { background: #163055; }
    .result { margin-top: 20px; padding: 16px; background: #eaf3ea; border-left: 5px solid #2e7d32; border-radius: 6px; font-size: 18px; }
    .result.error { background: #fdecea; border-left-color: #c62828; }
</style>
</head>
<body>

<h1>🚗 Vehicle Price Predictor</h1>
<p>Enter a vehicle's specifications to estimate its price (ElasticNet regression model).</p>

<form action="/predict" method="post">

    <div><label>Symboling (-2 to 3)</label><input type="number" step="1" name="symboling" value="0" required></div>
    <div><label>Normalized Losses (65-256)</label><input type="number" step="any" name="normalized-losses" value="120" required></div>
    <div><label>Num. of Doors</label>
        <select name="num-of-doors">{% for d in num_doors %}<option value="{{d}}">{{d}}</option>{% endfor %}</select>
    </div>

    <div><label>Make</label>
        <select name="make">{% for m in makes %}<option value="{{m}}">{{m}}</option>{% endfor %}</select>
    </div>
    <div><label>Fuel Type</label>
        <select name="fuel-type">{% for f in fuel_types %}<option value="{{f}}">{{f}}</option>{% endfor %}</select>
    </div>
    <div><label>Aspiration</label>
        <select name="aspiration">{% for a in aspirations %}<option value="{{a}}">{{a}}</option>{% endfor %}</select>
    </div>

    <div><label>Body Style</label>
        <select name="body-style">{% for b in body_styles %}<option value="{{b}}">{{b}}</option>{% endfor %}</select>
    </div>
    <div><label>Drive Wheels</label>
        <select name="drive-wheels">{% for d in drive_wheels %}<option value="{{d}}">{{d}}</option>{% endfor %}</select>
    </div>
    <div><label>Engine Location</label>
        <select name="engine-location">{% for e in engine_locations %}<option value="{{e}}">{{e}}</option>{% endfor %}</select>
    </div>

    <div><label>Wheel Base (86-121)</label><input type="number" step="any" name="wheel-base" value="98" required></div>
    <div><label>Length (141-208)</label><input type="number" step="any" name="length" value="175" required></div>
    <div><label>Width (60-72)</label><input type="number" step="any" name="width" value="66" required></div>

    <div><label>Height (48-60)</label><input type="number" step="any" name="height" value="54" required></div>
    <div><label>Curb Weight (1488-4066)</label><input type="number" step="any" name="curb-weight" value="2400" required></div>
    <div><label>Num. of Cylinders</label>
        <select name="num-of-cylinders">{% for c in num_cylinders %}<option value="{{c}}">{{c}}</option>{% endfor %}</select>
    </div>

    <div><label>Engine Type</label>
        <select name="engine-type">{% for e in engine_types %}<option value="{{e}}">{{e}}</option>{% endfor %}</select>
    </div>
    <div><label>Engine Size (61-326)</label><input type="number" step="any" name="engine-size" value="120" required></div>
    <div><label>Fuel System</label>
        <select name="fuel-system">{% for f in fuel_systems %}<option value="{{f}}">{{f}}</option>{% endfor %}</select>
    </div>

    <div><label>Bore (2.54-3.94)</label><input type="number" step="any" name="bore" value="3.2" required></div>
    <div><label>Stroke (2.07-4.17)</label><input type="number" step="any" name="stroke" value="3.2" required></div>
    <div><label>Compression Ratio (7-23)</label><input type="number" step="any" name="compression-ratio" value="9" required></div>

    <div><label>Horsepower (48-262)</label><input type="number" step="any" name="horsepower" value="100" required></div>
    <div><label>Peak RPM (4150-6600)</label><input type="number" step="any" name="peak-rpm" value="5000" required></div>
    <div><label>Highway MPG (16-54)</label><input type="number" step="any" name="highway-mpg" value="28" required></div>

    <div class="full-row"><button type="submit">Predict Price</button></div>
</form>

{% if prediction %}
<div class="result {% if 'Error' in prediction %}error{% endif %}">
    <strong>Predicted Price:</strong> {{ prediction }}
</div>
{% endif %}

</body>
</html>
